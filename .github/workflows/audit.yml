name: Ecosystem audit

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --dev --python 3.12
      - name: Collect qualification evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run ml4t-ecosystem collect --allow-failures
      - name: Monitor issues and pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run ml4t-ecosystem monitor --output status/monitor.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ecosystem-status
          path: |
            status/current.json
            status/current.md
            status/monitor.json
