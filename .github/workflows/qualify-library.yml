name: Shared library qualification

on:
  workflow_call:
    inputs:
      import-package:
        description: Public Python import package
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ml4t/ecosystem
          ref: main
          path: .ecosystem
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true
      - run: >-
          uv run --project .ecosystem python .ecosystem/scripts/qualification.py
          --python ${{ matrix.python }} --import-package ${{ inputs.import-package }}

  prerelease:
    name: ${{ matrix.os }} / Python 3.15 prerelease
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ml4t/ecosystem
          ref: main
          path: .ecosystem
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true
      - run: >-
          uv run --project .ecosystem python .ecosystem/scripts/qualification.py
          --python 3.15 --import-package ${{ inputs.import-package }} --prerelease
