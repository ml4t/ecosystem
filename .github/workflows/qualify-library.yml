name: Shared library qualification

on:
  workflow_call:
    inputs:
      import-package:
        description: Public Python import package
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ml4t/ecosystem
          ref: 299977b0554811a952da8f3f1099385016a1509f
          path: .ecosystem
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
      - run: >-
          uv run --project .ecosystem python .ecosystem/scripts/qualification.py
          --python ${{ matrix.python }} --import-package ${{ inputs.import-package }}

  prerelease:
    name: ${{ matrix.os }} / Python 3.15 prerelease
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ml4t/ecosystem
          ref: 299977b0554811a952da8f3f1099385016a1509f
          path: .ecosystem
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
      - run: >-
          uv run --project .ecosystem python .ecosystem/scripts/qualification.py
          --python 3.15 --import-package ${{ inputs.import-package }} --prerelease
