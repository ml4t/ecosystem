name: Shared library qualification

on:
  workflow_call:
    inputs:
      import-package:
        description: Public Python import package
        required: true
        type: string
      candidate-version:
        description: Explicit candidate version for every build; wheel metadata must match
        required: false
        type: string
        default: ""
      fetch-depth:
        description: Library history depth; use 0 for commit-bound historical evidence tests
        required: false
        type: number
        default: 1
      prerelease-test-paths:
        description: JSON array of core test paths to run on the next CPython prerelease
        required: false
        type: string
        default: '["tests"]'
      prerelease-exception:
        description: Approved ecosystem exception id that replaces prerelease qualification
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    env:
      ML4T_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ml4t/ecosystem
          ref: 71f184b28d4761f363bf33bb7e538e59d896c4ae
          path: .ecosystem
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
      - run: >-
          uv run --project .ecosystem python .ecosystem/scripts/qualification.py
          --python ${{ matrix.python }} --import-package ${{ inputs.import-package }}

  prerelease:
    name: ${{ matrix.os }} / Python 3.15 prerelease
    env:
      ML4T_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ inputs.prerelease-exception == '' }}
        with:
          python-version: "3.15"
          allow-prereleases: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ml4t/ecosystem
          ref: 71f184b28d4761f363bf33bb7e538e59d896c4ae
          path: .ecosystem
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Qualify Python 3.15 prerelease
        if: ${{ inputs.prerelease-exception == '' }}
        run: >-
          uv run --project .ecosystem python .ecosystem/scripts/qualification.py
          --python 3.15 --import-package ${{ inputs.import-package }} --prerelease
          --preinstalled-python
        env:
          ML4T_PRERELEASE_TESTS_JSON: ${{ inputs.prerelease-test-paths }}
      - name: Validate approved Python 3.15 exception for this candidate
        if: ${{ inputs.prerelease-exception != '' }}
        run: >-
          uv run --project .ecosystem --python 3.12
          python .ecosystem/scripts/validate_exception.py
          --config .ecosystem/config/libraries.toml
          --exception-id ${{ inputs.prerelease-exception }}
          --repository ${{ github.repository }}
          --package-root .

  prerelease-exception:
    name: Validate Python 3.15 exception
    env:
      ML4T_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    if: ${{ inputs.prerelease-exception != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ml4t/ecosystem
          ref: 71f184b28d4761f363bf33bb7e538e59d896c4ae
          path: .ecosystem
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
      - run: >-
          uv run --project .ecosystem python .ecosystem/scripts/validate_exception.py
          --config .ecosystem/config/libraries.toml
          --exception-id ${{ inputs.prerelease-exception }}
          --repository ${{ github.repository }}
          --package-root candidate
