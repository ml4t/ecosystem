schema_version = 2
owner = "ml4t"

[policy]
minimum_python = "3.12"
stable_python = ["3.12", "3.13", "3.14"]
prerelease_python = "3.15"
operating_systems = ["ubuntu-latest", "macos-latest", "windows-latest"]
classification_target_minutes = 60
response_target_business_days = 2
maintainer_logins = ["stefan-jansen"]
author_name = "Stefan Jansen"
author_email = "stefan@applied-ai.com"
maintainer_name = "Stefan Jansen"
maintainer_email = "pm@ml4trading.io"
description_minimum_characters = 40
description_maximum_characters = 160
minimum_keywords = 5
required_keywords = ["finance", "quantitative-finance", "algorithmic-trading"]
required_classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
required_project_urls = ["Homepage", "Documentation", "Repository", "Issues", "Changelog"]
required_github_topics = ["ml4t", "python", "quantitative-finance", "algorithmic-trading"]
required_workflow_files = ["ci.yml", "ecosystem.yml", "docs.yml", "release.yml"]
documentation_base_url = "https://www.ml4trading.io/docs/"
documentation_repository = "ml4t/website"
homepage_url = "https://www.ml4trading.io/"

[[exceptions]]
id = "python-315-polars"
criterion = "python-3.15-prerelease"
libraries = ["data", "engineer"]
affected_versions = ">=0.1.2,<0.1.6"
rationale = "Polars 1.43.2 fails required expression and datetime operations on CPython 3.15.0rc1."
evidence = [
    "https://github.com/pola-rs/polars/issues/28347",
    "https://github.com/pola-rs/polars/pull/28750",
]
user_impact = "These distributions cannot be installed on Python 3.15 while the exception is active."
mitigation = "Use Python 3.12 through 3.14 until a compatible Polars release is qualified."
approver = "Stefan Jansen"
expires_on = 2026-09-30
issue = "https://github.com/ml4t/ecosystem/issues/2"

[[exceptions]]
id = "python-315-scipy"
criterion = "python-3.15-prerelease"
libraries = ["diagnostic"]
affected_versions = ">=0.1.2,<0.1.5"
rationale = "The published dependency set lacks required CPython 3.15 wheels for PyArrow 25.0.1 and pydantic-core 2.46.5."
evidence = [
    "https://github.com/ml4t/diagnostic/issues/45",
    "https://pypi.org/project/pyarrow/25.0.1/#files",
    "https://pypi.org/project/pydantic-core/2.46.5/#files",
]
user_impact = "The distribution cannot be installed on Python 3.15 while the exception is active."
mitigation = "Use Python 3.12 through 3.14 until the complete dependency set is qualified on Python 3.15."
approver = "Stefan Jansen"
expires_on = 2026-09-30
issue = "https://github.com/ml4t/ecosystem/issues/2"

[[libraries]]
key = "data"
repository = "data"
distribution = "ml4t-data"
import_package = "ml4t.data"
docs_url = "https://www.ml4trading.io/docs/data/"
local_checkout = "ml4t-data"
development_workspace = "ml4t-data-dev"
prerelease_exception = "python-315-polars"
deprecated_identifiers = ["QLDM_DATA_ROOT", "QldmError"]

