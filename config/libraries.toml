schema_version = 2
owner = "ml4t"

[policy]
minimum_python = "3.12"
stable_python = ["3.12", "3.13", "3.14"]
prerelease_python = "3.15"
operating_systems = ["ubuntu-latest", "macos-latest", "windows-latest"]
classification_target_minutes = 60
response_target_business_days = 2
maintainer_logins = ["stefan-jansen"]
author_name = "Stefan Jansen"
author_email = "stefan@applied-ai.com"
maintainer_name = "Stefan Jansen"
maintainer_email = "pm@ml4trading.io"
description_minimum_characters = 40
description_maximum_characters = 160
minimum_keywords = 5
required_keywords = ["finance", "quantitative-finance", "algorithmic-trading"]
required_classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
required_project_urls = ["Homepage", "Documentation", "Repository", "Issues", "Changelog"]
required_github_topics = ["ml4t", "python", "quantitative-finance", "algorithmic-trading"]
required_workflow_files = ["ci.yml", "ecosystem.yml", "docs.yml", "release.yml"]
documentation_base_url = "https://www.ml4trading.io/docs/"
documentation_repository = "ml4t/website"
homepage_url = "https://www.ml4trading.io/"

[[exceptions]]
id = "python-315-polars"
criterion = "python-3.15-prerelease"
libraries = ["data", "engineer"]
affected_versions = ">=0.1.2,<0.3"
rationale = "Polars 1.44.2 fails required series construction on CPython 3.15.0rc1."
evidence = [
    "https://github.com/ml4t/data/issues/37",
    "https://github.com/pola-rs/polars/issues/28347",
    "https://github.com/pola-rs/polars/pull/28750",
    "https://pypi.org/project/polars/1.44.2/#files",
]
user_impact = "These distributions cannot be installed on Python 3.15 while the prerelease wait applies."
mitigation = "Use Python 3.12 through 3.14 until a compatible Polars release is qualified."
approver = "Stefan Jansen"
review_triggers = ["python-3.15-final", "polars-release-after-1.44.2"]
issue = "https://github.com/ml4t/ecosystem/issues/2"

[[exceptions]]
id = "python-315-data-databento-030"
criterion = "python-3.15-prerelease"
libraries = ["data"]
affected_versions = ">=0.3,<0.4"
rationale = "Databento 0.88.0 requires databento-dbn~=0.70.0, whose released wheels cannot satisfy the complete Data environment on CPython 3.15 final. Polars is no longer the demonstrated Data blocker."
evidence = [
    "https://github.com/ml4t/data/issues/37#issuecomment-6374129753",
    "https://pypi.org/pypi/databento/0.88.0/json",
    "https://pypi.org/pypi/databento-dbn/0.70.0/json",
]
user_impact = "Data 0.3 releases support Python 3.12 through 3.14 and retain Requires-Python <3.15. Core-only Python 3.15 probes do not qualify the complete distribution."
mitigation = "Keep all Python 3.12-3.14 operating-system gates and the visible monthly Python 3.15 canary. Qualify the complete released dependency set on Linux, macOS and Windows before removing the upper bound."
approver = "Stefan Jansen"
review_triggers = ["released-databento-cp315-dependency-support"]
issue = "https://github.com/ml4t/data/issues/37"

[[exceptions]]
id = "python-315-scipy"
criterion = "python-3.15-prerelease"
libraries = ["diagnostic"]
affected_versions = ">=0.1.2,<0.3"
rationale = "Current Diagnostic core dependencies install and import on CPython 3.15, including PyArrow 26. Full Diagnostic source, installed-artifact and three-operating-system qualification is pending. This is a bounded qualification deferral, not a missing-wheel claim."
evidence = [
    "https://github.com/ml4t/diagnostic/issues/45",
    "https://pypi.org/project/pyarrow/26.0.0/#files",
]
user_impact = "Diagnostic retains Requires-Python >=3.12,<3.15 and does not advertise Python 3.15 support. Qualified Python 3.12-3.14 releases may continue through the 0.2 line."
mitigation = "Retain every Python 3.12-3.14 gate and run a visible monthly three-OS Python 3.15 candidate canary. Remove the upper bound and exception only after complete native and installed-artifact qualification."
approver = "Stefan Jansen"
expires_on = 2026-11-24
review_triggers = ["diagnostic-python315-three-os-qualification-completed"]
issue = "https://github.com/ml4t/diagnostic/issues/45"

[[exceptions]]
id = "python-315-live-calendar-020"
criterion = "python-3.15-prerelease"
libraries = ["live"]
affected_versions = ">=0.2.0.dev0,<0.3"
rationale = "Live's strict public HKEX calendar workflow fails in exchange-calendars 4.13.2 with NumPy 2.5.4 on CPython 3.15 final: generic-unit datetime arithmetic raises a DeprecationWarning. NumPy 2.4.6 avoids that operation's warning but only advertises Python 3.11-3.14 support and fails import in the actual Windows 3.15 job. This is a calendar dependency compatibility wait, not a claim of incorrect schedule values or missing NumPy 3.15 wheels."
evidence = [
    "https://github.com/ml4t/ecosystem/issues/2",
    "https://github.com/ml4t/live/actions/runs/40421184735/job/121915993276",
    "https://github.com/gerrymanoim/exchange_calendars/blob/4.13.2/exchange_calendars/exchange_calendar_xhkg.py",
    "https://github.com/numpy/numpy/releases/tag/v2.4.6",
    "https://github.com/numpy/numpy/releases/tag/v2.5.4",
]
user_impact = "Live 0.2 supports Python 3.12-3.14 with truthful Requires-Python <3.15 and its qualified NumPy <2.5 and pandas <3.1 bounds; Python 3.15 is not supported while the wait applies. Published Live 0.1.3 and other libraries' compatibility remain unchanged."
mitigation = "Retain every supported OS/Python, artifact, provider and strict-warning gate. Run a visible monthly three-OS Python 3.15 canary resolving all declared dependencies separately and exercising the public Hong Kong calendar plus explicitly unsupported source workflows. Do not suppress warnings or substitute a historically different calendar provider. Complete normal installed-artifact and full-source qualification on all three operating systems before removing the bound."
approver = "ML4T maintainers (delegated compatibility review)"
expires_on = 2026-11-26
review_triggers = ["exchange-calendars-release-after-4.13.2", "pandas-market-calendars-release-after-5.5.0", "numpy-release-after-2.5.4", "live-python315-three-os-qualification-completed"]
issue = "https://github.com/ml4t/ecosystem/issues/2"

