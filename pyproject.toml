[project]
name = "ml4t-ecosystem"
version = "0.1.0"
description = "Shared standards and qualification tooling for ML4T libraries"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stefan Jansen" }]
dependencies = [
    "httpx>=0.28,<1",
    "packaging>=24,<27",
    "pyyaml>=6.0,<7",
]

[project.scripts]
ml4t-ecosystem = "ml4t_ecosystem.cli:main"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.15,<0.16",
    "ty>=0.0.7,<0.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t_ecosystem"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/ml4t_ecosystem",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ml4t_ecosystem"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ty.src]
include = ["src", "tests"]
